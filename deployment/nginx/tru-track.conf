server {
    listen 80 default_server;
    server_name _;

    root /opt/tru-track/dashboard;
    index index.html;

    access_log /var/log/nginx/tru-track-access.log;
    error_log  /var/log/nginx/tru-track-error.log warn;

    client_max_body_size 10m;

    location = / {
        try_files /index.html =404;
    }

    location = /fleet {
        try_files /fleet.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }


    location /docker/api/ {
        proxy_pass         http://127.0.0.1:19000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /docker/socket.io/ {
        proxy_pass         http://127.0.0.1:19000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
    location /docker/ {
        gzip off;
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript;
        sub_filter "BASE = '';" "BASE = '/docker';";
        sub_filter 'href="/'  'href="/docker/';
        sub_filter 'src="/'   'src="/docker/';
        alias /opt/tru-track/dashboard/;
        index index.html;
        try_files $uri $uri/ /docker/index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
