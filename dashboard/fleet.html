<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TRU-TRACK — Fleet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080a0d;--card:#0e1014;--border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);--text:#f0f1f3;--muted:#5a6270;
  --green:#00e887;--yellow:#ffb800;--red:#ff4444;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
.app{display:flex;height:100vh}

/* ── Map ───────────────────────────────────────────────── */
#map{flex:1;height:100vh}

/* ── Sidebar ───────────────────────────────────────────── */
.sidebar{
  width:290px;flex-shrink:0;height:100vh;
  background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:1000;
}

/* Header */
.hdr{padding:14px 14px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:9px}
.logo{width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#00f2fe,#2d8cff);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#000;flex-shrink:0}
.hdr-text{flex:1}
.hdr-t{font-size:13px;font-weight:800;letter-spacing:-0.2px}
.hdr-s{font-size:9px;color:var(--muted);margin-top:1px}
.back{padding:4px 9px;border-radius:6px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  color:var(--muted);font-size:9px;text-decoration:none;
  transition:all 0.15s;white-space:nowrap}
.back:hover{color:var(--text);border-color:var(--border2)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--border)}
.stat{padding:10px 0;text-align:center}
.stat-n{font-size:20px;font-weight:800;font-family:var(--mono);display:block}
.stat-l{font-size:8px;color:var(--muted);text-transform:uppercase;
  letter-spacing:0.6px;margin-top:1px;display:block}
.g{color:var(--green)}.y{color:var(--yellow)}.r{color:var(--red)}

/* Action buttons */
.actions{display:flex;gap:6px;padding:9px 10px;border-bottom:1px solid var(--border)}
.btn{flex:1;padding:7px 4px;border-radius:7px;font-size:9.5px;font-weight:600;
  cursor:pointer;transition:all 0.15s;text-align:center;font-family:var(--font);border:1px solid}
.btn-live{background:rgba(0,232,135,0.08);border-color:rgba(0,232,135,0.25);color:var(--green)}
.btn-live:hover{background:rgba(0,232,135,0.18)}
.btn-all{background:rgba(255,255,255,0.04);border-color:var(--border2);color:var(--text)}
.btn-all:hover{background:rgba(255,255,255,0.09)}
.btn-none{background:rgba(255,68,68,0.05);border-color:rgba(255,68,68,0.2);color:var(--red)}
.btn-none:hover{background:rgba(255,68,68,0.12)}

/* Device list */
.sec-label{padding:7px 12px 4px;font-size:8px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.8px;color:var(--muted)}
.dlist{overflow-y:auto;flex:1;padding:0 8px 8px}
.dlist::-webkit-scrollbar{width:2px}
.dlist::-webkit-scrollbar-thumb{background:var(--border2)}

/* Device card */
.dcard{display:flex;align-items:center;gap:0;padding:0;
  border-radius:9px;margin-bottom:6px;border:1px solid var(--border);
  background:rgba(255,255,255,0.015);overflow:hidden;
  transition:border-color 0.15s}
.dcard.checked{border-color:var(--accent, #666)}
.dcard:hover{border-color:var(--border2)}

/* Checkbox area */
.cb-wrap{padding:12px 10px 12px 12px;display:flex;align-items:center;cursor:pointer;flex-shrink:0}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all 0.15s;cursor:pointer}
.cb.on{border-color:transparent}
.cb svg{display:none}
.cb.on svg{display:block}

/* Device info */
.d-info{flex:1;padding:10px 10px 10px 0;min-width:0;cursor:pointer}
.d-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.d-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-dot.live{box-shadow:0 0 6px currentColor}
.d-id{font-size:10px;font-weight:700;font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.d-badge{font-size:8px;font-weight:700;padding:2px 6px;border-radius:8px;
  text-transform:uppercase;flex-shrink:0}
.d-badge.live{background:rgba(0,232,135,0.1);color:var(--green)}
.d-badge.stale{background:rgba(255,184,0,0.1);color:var(--yellow)}
.d-badge.offline{background:rgba(255,68,68,0.07);color:var(--red)}
.d-stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.d-stat{display:flex;flex-direction:column;gap:0}
.d-stat-l{font-size:7.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px}
.d-stat-v{font-size:9px;font-family:var(--mono)}
.d-pkts{font-size:8px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* Color strip */
.d-strip{width:3px;flex-shrink:0;align-self:stretch}

/* Refresh bar */
.rfr{padding:7px 10px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.rfr-l{font-size:8.5px;color:var(--muted)}
.rfr-t{font-family:var(--mono);color:#00f2fe;font-size:8.5px}
.rfr-btn{padding:3px 8px;border-radius:5px;
  background:rgba(0,242,254,0.07);border:1px solid rgba(0,242,254,0.18);
  color:#00f2fe;font-size:8.5px;cursor:pointer;font-family:var(--font)}
.rfr-btn:hover{background:rgba(0,242,254,0.16)}

/* Footer */
.ftr{padding:7px 12px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.ftr-t{font-size:8.5px;color:var(--muted);font-family:var(--mono)}

/* Map overlays */
.map-wrap{position:relative;flex:1;min-width:0;height:100vh}
.fit-btn{position:absolute;top:12px;right:12px;z-index:1000;
  padding:8px 12px;border-radius:8px;
  background:rgba(10,11,13,0.92);backdrop-filter:blur(12px);
  border:1px solid var(--border2);color:var(--text);font-size:10px;
  font-weight:600;cursor:pointer;font-family:var(--font);
  transition:all 0.15s}
.fit-btn:hover{background:rgba(255,255,255,0.1)}

/* Legend */
.legend{position:absolute;bottom:22px;right:12px;z-index:1000;
  background:rgba(10,11,13,0.92);backdrop-filter:blur(12px);
  border:1px solid var(--border2);border-radius:9px;padding:10px 13px;
  min-width:120px}
.leg-row{display:flex;align-items:center;gap:7px;
  font-size:8.5px;color:var(--muted);margin-bottom:4px}
.leg-row:last-child{margin-bottom:0}
.leg-line{width:18px;height:3px;border-radius:2px;flex-shrink:0}

/* Popup */
.leaflet-popup-content-wrapper{background:rgba(12,14,20,0.96)!important;
  border:1px solid rgba(255,255,255,0.12)!important;border-radius:10px!important;
  box-shadow:0 12px 40px rgba(0,0,0,0.6)!important}
.leaflet-popup-content{margin:0!important;padding:0!important}
.leaflet-popup-tip{background:rgba(12,14,20,0.96)!important}
.leaflet-popup-close-button{color:rgba(255,255,255,0.4)!important;top:7px!important;right:7px!important}
.pop{padding:12px 14px;min-width:170px}
.pop-top{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.pop-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pop-id{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff}
.pr{display:flex;justify-content:space-between;margin-bottom:4px}
.pl{font-size:8px;color:#6b7280;text-transform:uppercase;letter-spacing:0.4px}
.pv{font-size:9px;font-family:var(--mono);color:#e5e7eb}

/* Loading */
.loading{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spin{width:30px;height:30px;border:2.5px solid var(--border);
  border-top-color:#00f2fe;border-radius:50%;animation:sp 0.7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading p{font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spin"></div><p>Loading fleet…</p></div>

<div class="app" id="app" style="display:none">
  <!-- MAP -->
  <div class="map-wrap">
    <div id="map" style="width:100%;height:100%"></div>
    <div id="tile-bar" style="position:absolute;top:0;left:0;right:0;height:2px;
      background:rgba(0,242,254,0.8);transition:width 0.3s;width:0%;z-index:1000;
      box-shadow:0 0 8px #00f2fe"></div>
    <button class="fit-btn" onclick="fitAll()">⊡ Fit all</button>
    <div class="legend" id="legend" style="display:none"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="hdr">
      <div class="logo">TT</div>
      <div class="hdr-text">
        <div class="hdr-t">Fleet Map</div>
        <div class="hdr-s">Multi-device live tracking</div>
      </div>
      <a class="back" href="/">← Dashboard</a>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-n g" id="s-live">—</span><span class="stat-l">Live</span></div>
      <div class="stat"><span class="stat-n y" id="s-sel">—</span><span class="stat-l">Selected</span></div>
      <div class="stat"><span class="stat-n" id="s-pkt" style="color:#00f2fe">—</span><span class="stat-l">Pkts/s</span></div>
    </div>

    <div class="actions">
      <button class="btn btn-live" onclick="selectLive()">● Show live</button>
      <button class="btn btn-all"  onclick="selectAll()">☑ All</button>
      <button class="btn btn-none" onclick="selectNone()">☐ None</button>
    </div>

    <div class="sec-label">Devices</div>
    <div class="dlist" id="dlist"><div style="padding:16px;text-align:center;color:var(--muted);font-size:11px">Loading…</div></div>

    <div class="rfr">
      <span class="rfr-l">Refresh <span class="rfr-t" id="cd">5s</span></span>
      <button class="rfr-btn" onclick="doFleet()">↻ Now</button>
    </div>

    <div class="ftr">
      <span class="ftr-t" id="ftr-t">—</span>
      <span class="ftr-t" id="ftr-s">—</span>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('tt_access_token') || localStorage.getItem('access_token');
function api(u){
  const h={'Content-Type':'application/json'};
  if(token) h['Authorization']='Bearer '+token;
  return fetch(u,{headers:h,cache:'no-store'});
}

// ── Colour palette ─────────────────────────────────────
const PALETTE = [
  '#2d8cff','#00e887','#f97316','#a855f7',
  '#eab308','#ec4899','#06b6d4','#ef4444'
];
let colorIdx = 0;
const deviceColors = {};
function getColor(did){
  if(!deviceColors[did]) deviceColors[did] = PALETTE[(colorIdx++)%PALETTE.length];
  return deviceColors[did];
}

// ── Helpers ─────────────────────────────────────────────
function nowIST(){
  return new Date().toLocaleTimeString('en-IN',{
    timeZone:'Asia/Kolkata',hour12:false,
    hour:'2-digit',minute:'2-digit',second:'2-digit'
  })+' IST';
}
function ageStr(s){
  if(s==null)return '—';
  if(s<60)  return s.toFixed(0)+'s ago';
  if(s<3600)return (s/60).toFixed(0)+'m ago';
  return (s/3600).toFixed(1)+'h ago';
}

// ── State ────────────────────────────────────────────────
let fleetData   = [];
let selected    = new Set();   // checked device_ids
let countdown   = 5;
let cdTimer     = null;
let pktRates    = {};
let pktCounts   = {};
let pktTimer    = null;

// Per-device map objects (always created for all devices with position)
let devMarkers    = {};   // device_id → L.marker
let devPolylines  = {};   // device_id → L.polyline

// ── Tile loading bar ─────────────────────────────────
function tileProgress(loading, total){
  const pct = total > 0 ? Math.round((1 - loading/total)*100) : 100;
  const bar = document.getElementById('tile-bar');
  if(bar){ bar.style.width = pct+'%'; if(pct>=100) setTimeout(()=>bar.style.width='0%',600); }
}
// ── Map ──────────────────────────────────────────────────
const map = L.map('map',{zoomControl:true,attributionControl:false});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 22, maxNativeZoom: 19,
    keepBuffer: 4,
    updateWhenIdle: false,
    updateWhenZooming: false,
    crossOrigin: true,
    attribution: 'Esri'
}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
    maxZoom: 22, maxNativeZoom: 19,
    opacity: 0.8,
    keepBuffer: 4,
    updateWhenIdle: false,
    updateWhenZooming: false,
    crossOrigin: true
}).addTo(map);
map.setView([21.17,72.83],12);

function mkMarkerIcon(col, online){
  const sz = online==='live' ? 15 : 10;
  const gw = online==='live' ? `box-shadow:0 0 8px ${col},0 0 18px ${col}55;` : '';
  return L.divIcon({
    className:'',
    html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;
      background:${col};border:2.5px solid rgba(255,255,255,0.9);${gw}
      transform:translate(-50%,-50%)"></div>`,
    iconSize:[0,0],iconAnchor:[0,0]
  });
}

function fitAll(){
  const pts = [];
  for(const did of Object.keys(devMarkers)){
    const ll = devMarkers[did].getLatLng();
    pts.push(ll);
  }
  for(const did of Object.keys(devPolylines)){
    const lls = devPolylines[did].getLatLngs();
    lls.forEach(ll=>pts.push(ll));
  }
  if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[40,40]});
}

// ── Socket.IO ─────────────────────────────────────────────
let socket;
try {
  socket = io(window.location.origin,{transports:['websocket','polling']});
} catch(e) {
  console.warn('Socket.IO not available — live updates disabled');
  socket = {on:()=>{}, emit:()=>{}};
}

socket.on('connect',()=>{
  // Rejoin all selected rooms on reconnect
  selected.forEach(did=> socket.emit('join_device',{device_id:did}));
});

socket.on('live_eskf',(doc)=>{
  const did = doc.device_id;
  if(!did || !selected.has(did)) return;

  pktCounts[did] = (pktCounts[did]||0) + 1;
  pktRates[did]  = (pktRates[did]||0) + 1;

  if(doc.lat && doc.lon && Math.abs(doc.lat)>0.01){
    // Update marker
    if(devMarkers[did]) devMarkers[did].setLatLng([doc.lat,doc.lon]);
    // Extend polyline
    if(devPolylines[did]) devPolylines[did].addLatLng([doc.lat,doc.lon]);
  }

  // Update pkt counter in card
  const el = document.getElementById(`pkt-${did}`);
  if(el) el.textContent = `${pktCounts[did]} pkts`;
});

// Pkt/s counter
pktTimer = setInterval(()=>{
  const total = Object.values(pktRates).reduce((a,b)=>a+b,0);
  document.getElementById('s-pkt').textContent = total;
  pktRates = {};
},1000);

// ── Checkbox helpers ──────────────────────────────────────
function setSelected(did, on){
  if(on){
    selected.add(did);
    socket.emit('join_device',{device_id:did});
    // Create polyline if doesn't exist
    const col = getColor(did);
    if(!devPolylines[did]){
      devPolylines[did] = L.polyline([],{color:col,weight:3,opacity:0.9}).addTo(map);
    } else {
      devPolylines[did].addTo(map);
    }
  } else {
    selected.delete(did);
    // Remove polyline from map (keep data)
    if(devPolylines[did]) map.removeLayer(devPolylines[did]);
  }
  updateCard(did);
  updateStats();
  renderLegend();
}

function updateCard(did){
  const card = document.getElementById(`card-${did}`);
  if(!card) return;
  const cb   = card.querySelector('.cb');
  const on   = selected.has(did);
  const col  = getColor(did);
  card.style.setProperty('--accent', col);
  card.classList.toggle('checked', on);
  cb.classList.toggle('on', on);
  cb.style.background = on ? col : 'transparent';
  const strip = card.querySelector('.d-strip');
  if(strip) strip.style.background = on ? col : 'rgba(255,255,255,0.06)';
}

function updateStats(){
  const live = fleetData.filter(d=>d.online==='live').length;
  document.getElementById('s-live').textContent = live;
  document.getElementById('s-sel').textContent  = selected.size;
}

// ── Bulk actions ──────────────────────────────────────────
function selectLive(){
  fleetData.forEach(d=>{ if(d.online==='live') setSelected(d.device_id,true); });
}
function selectAll(){
  fleetData.forEach(d=>setSelected(d.device_id,true));
}
function selectNone(){
  [...selected].forEach(did=>setSelected(did,false));
}

// ── Fleet fetch ───────────────────────────────────────────
async function doFleet(){
  clearInterval(cdTimer);
  try{
    const res = await api('/api/fleet');
    if(res.status===401){ window.location.href='/login'; return; }
    const data = await res.json();
    if(Array.isArray(data)) renderFleet(data);
  }catch(e){
    document.getElementById('ftr-s').textContent='Error';
  }
  startCD();
}

function startCD(){
  countdown=5;
  document.getElementById('cd').textContent='5s';
  clearInterval(cdTimer);
  cdTimer=setInterval(()=>{
    countdown--;
    document.getElementById('cd').textContent=countdown+'s';
    if(countdown<=0){clearInterval(cdTimer);doFleet();}
  },1000);
}

function renderFleet(devices){
  fleetData = devices;
  const order={live:0,stale:1,offline:2};
  const sorted=[...devices].sort((a,b)=>(order[a.online]||9)-(order[b.online]||9));

  // Assign colors
  devices.forEach(d=>getColor(d.device_id));

  // Update/create markers
  const seen=new Set();
  for(const d of devices){
    const did=d.device_id, col=getColor(did);
    seen.add(did);
    if(d.lat&&d.lon){
      const icon=mkMarkerIcon(col,d.online);
      const pop=popHtml(d,col);
      if(devMarkers[did]){
        devMarkers[did].setLatLng([d.lat,d.lon]).setIcon(icon);
        if(devMarkers[did].isPopupOpen()) devMarkers[did].getPopup().setContent(pop);
      } else {
        const m=L.marker([d.lat,d.lon],{icon}).addTo(map)
          .bindPopup(pop,{maxWidth:200,minWidth:180});
        m.on('click',()=>{});
        devMarkers[did]=m;
      }
    }
  }
  // Remove gone devices
  for(const did of Object.keys(devMarkers)){
    if(!seen.has(did)){ map.removeLayer(devMarkers[did]); delete devMarkers[did]; }
  }

  // Render cards
  const list=document.getElementById('dlist');
  list.innerHTML = sorted.map(d=>{
    const did=d.device_id, col=getColor(did);
    const on=selected.has(did);
    const lastT = d.last_seen_display
      ? d.last_seen_display.split(' ').slice(1).join(' ')+' IST'
      : '—';
    const fixC  = d.fix_valid ? `color:${col}` : 'color:var(--yellow)';
    const pkts  = pktCounts[did]||0;
    return `<div class="dcard${on?' checked':''}" id="card-${did}" style="--accent:${col}">
      <div class="d-strip" style="background:${on?col:'rgba(255,255,255,0.06)'}"></div>
      <div class="cb-wrap" onclick="toggleCheck('${did}')">
        <div class="cb${on?' on':''}" style="background:${on?col:'transparent'}">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 5l2.5 2.5L8 3" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="d-info" onclick="toggleCheck('${did}')">
        <div class="d-top">
          <div class="d-dot ${d.online}" style="color:${col};background:${col}"></div>
          <div class="d-id" title="${did}">${did}</div>
          <div class="d-badge ${d.online}">${d.online}</div>
        </div>
        <div class="d-stats">
          <div class="d-stat">
            <span class="d-stat-l">GNSS</span>
            <span class="d-stat-v" style="${fixC}">${d.fix_valid?'✓ Fix':'✗ Lost'} · ${d.sats??'—'}sat</span>
          </div>
          <div class="d-stat">
            <span class="d-stat-l">Last seen</span>
            <span class="d-stat-v">${ageStr(d.age_s)}</span>
          </div>
          <div class="d-stat">
            <span class="d-stat-l">WiFi</span>
            <span class="d-stat-v">${d.wifi_rssi_dbm!=null?d.wifi_rssi_dbm+' dBm':'—'}</span>
          </div>
          <div class="d-stat">
            <span class="d-stat-l">ESKF</span>
            <span class="d-stat-v" style="color:${d.eskf_init?'var(--green)':'var(--yellow)'}">
              ${d.eskf_init?'Ready':'Waiting'}
            </span>
          </div>
        </div>
        <div class="d-pkts" id="pkt-${did}">${pkts?pkts+' pkts':'—'}</div>
      </div>
    </div>`;
  }).join('') || `<div style="padding:16px;text-align:center;color:var(--muted);font-size:11px">No devices found</div>`;

  updateStats();
  renderLegend();
  document.getElementById('ftr-t').textContent=nowIST();
  document.getElementById('ftr-s').textContent=`${devices.length} device${devices.length!==1?'s':''}`;
}

function toggleCheck(did){
  setSelected(did, !selected.has(did));
}

// ── Legend ─────────────────────────────────────────────────
function renderLegend(){
  const lg=document.getElementById('legend');
  const active=[...selected].filter(did=>fleetData.find(d=>d.device_id===did));
  if(!active.length){ lg.style.display='none'; return; }
  lg.style.display='block';
  lg.innerHTML=active.map(did=>{
    const col=getColor(did);
    const shortId=did.split(':').slice(-3).join(':');
    return `<div class="leg-row">
      <div class="leg-line" style="background:${col}"></div>
      <span style="font-family:var(--mono);color:${col};font-size:8.5px">${shortId}</span>
    </div>`;
  }).join('');
}

// ── Popup ───────────────────────────────────────────────────
function popHtml(d,col){
  const gw=d.online==='live'?`box-shadow:0 0 6px ${col};`:'';
  const lastT=d.last_seen_display
    ?(d.last_seen_display.split(' ').slice(1).join(' ')+' IST'):'—';
  return `<div class="pop">
    <div class="pop-top">
      <div class="pop-dot" style="background:${col};${gw}"></div>
      <div class="pop-id">${d.device_id}</div>
    </div>
    <div class="pr"><span class="pl">Status</span><span class="pv">${d.online.toUpperCase()}</span></div>
    <div class="pr"><span class="pl">GNSS</span><span class="pv" style="color:${d.fix_valid?'#00e887':'#ffb800'}">${d.fix_valid?'✓ Fix':'✗ Lost'} · ${d.sats??'—'} sat</span></div>
    <div class="pr"><span class="pl">HDOP</span><span class="pv">${d.hdop!=null?Number(d.hdop).toFixed(1):'—'}</span></div>
    <div class="pr"><span class="pl">Speed</span><span class="pv">${d.speed_mps!=null?(Number(d.speed_mps)*3.6).toFixed(1)+' km/h':'—'}</span></div>
    <div class="pr"><span class="pl">Last seen</span><span class="pv">${lastT}</span></div>
    <div class="pr"><span class="pl">Firmware</span><span class="pv">${d.fw_version||'—'}</span></div>
  </div>`;
}

// ── Init ────────────────────────────────────────────────────
async function init(){
  if(!token){ window.location.href='/login?from=fleet'; return; }
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  setTimeout(()=>map.invalidateSize(true), 50);
  await doFleet();
  // Auto-select all live devices on load
  selectLive();
}

init();
</script>
</body>
</html>
